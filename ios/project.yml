name: MoYu
options:
  bundleIdPrefix: com.moyu
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

schemes:
  MoYu:
    build:
      targets:
        MoYu: all
    run:
      config: Release
    archive:
      config: Release

targets:
  MoYu:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: MoYu
        PRODUCT_BUNDLE_IDENTIFIER: com.moyu.notes
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ONLY_ACTIVE_ARCH: "NO"
        ARCHS: arm64
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
    postCompileScripts:
      - name: Sync Web Assets
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/www"
          mkdir -p "$DEST"
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'ios' \
            --exclude '.github' \
            --exclude '.workbuddy' \
            --exclude '.DS_Store' \
            "${SRCROOT}/../" "$DEST/"
          echo "web assets -> $DEST"
          ls "$DEST"
