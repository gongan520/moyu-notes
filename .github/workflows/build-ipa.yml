name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

# 只保留最新一次构建，避免 macOS runner 排队时堆积一堆 queued 任务
concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build:
    # macos-14/15 是 arm64 托管机，免费额度下经常拿不到 runner（job not acquired）；
    # macos-13 是 Intel 机器，交叉编译 arm64 一样可行，排队快很多
    runs-on: macos-13
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project MoYu.xcodeproj \
            -scheme MoYu \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -quiet \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="ios/build/Build/Products/Release-iphoneos/MoYu.app"
          if [ ! -d "$APP" ]; then
            echo "构建产物不存在，列出目录："
            find ios/build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry MoYu-unsigned.ipa Payload
          ls -lh MoYu-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoYu-unsigned-ipa
          path: out/MoYu-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MoYu-unsigned.ipa
          generate_release_notes: true

      # main 分支也发一份到固定的 latest release，
      # 这样不装本地工具也能直接在 GitHub 网页点下载
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP="ios/build/Build/Products/Release-iphoneos/MoYu.app"
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          SIZE=$(du -h out/MoYu-unsigned.ipa | cut -f1)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > /tmp/notes.md <<EOF
          ## 墨屿 v${VER} (build ${BUILD})

          未签名 ipa，**不能直接双击安装**，需要用 Sideloadly / AltStore / ESign 自签后装到 iPad，或 TrollStore 直接装。

          | | |
          |---|---|
          | 版本 | ${VER} |
          | 构建号 | ${BUILD} |
          | 大小 | ${SIZE} |
          | 架构 | arm64 |
          | 最低系统 | iOS 15.0 |
          | 构建时间 | ${DATE} |
          | commit | \`${{ github.sha }}\` |

          ### 这一版有什么
          - PDF 导入批注（中文 PDF 正常显示，导出 144 dpi）
          - 录音 + 笔迹时间轴同步回放
          - 大纲 / 一键转思维导图
          - 闪卡 + SM-2 间隔重复
          - 图层（显隐 / 锁定 / 合并）
          - 套索缩放旋转、全文搜索
          - 六种内置中文字体

          详细说明见仓库 README。
          EOF
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "墨屿 · 最新构建" --notes-file /tmp/notes.md
          gh release edit latest --title "墨屿 · 最新构建" --notes-file /tmp/notes.md
          gh release upload latest out/MoYu-unsigned.ipa --clobber
          echo "已发布：https://github.com/${{ github.repository }}/releases/tag/latest"
