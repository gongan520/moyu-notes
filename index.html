<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>墨屿 · 手写笔记</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="墨屿" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#111113" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/icon-180.png" />
<link rel="icon" type="image/png" href="./assets/icon-180.png" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ══════════════════ 资料库（Notability 式：左栏 + 右内容） ══════════════════ -->
  <section class="view view--library is-active" id="viewLibrary">
    <aside class="lib-side" id="libSide">
      <div class="side-head">
        <div class="side-brand">
          <span class="brand-dot"></span>
          <h1>墨屿</h1>
        </div>
        <div class="side-head-acts">
          <button class="icon-btn icon-btn--sm" id="btnSettings" title="设置">
            <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34h.01a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55h.01a1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87v.01a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
          </button>
          <button class="icon-btn icon-btn--sm" id="btnSideToggle" title="收起/展开侧栏">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </button>
        </div>
      </div>

      <label class="side-search">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="search" id="libSearch" placeholder="搜索" autocomplete="off" />
      </label>

      <div class="side-sec">
        <span>主题</span>
        <button class="side-plus" id="btnStarFilter" title="只看收藏">★</button>
        <button class="side-plus" id="btnNewFolderSide" title="新建文件夹">＋</button>
        <button class="side-plus" id="btnNewDivider" title="新建分组">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
      </div>
      <div class="side-folders" id="libNav"></div>
      <nav class="side-nav" id="sideNav">
        <button class="side-item" data-nav="words">
          <svg viewBox="0 0 24 24" class="ico"><path d="M5 5h9a3 3 0 013 3v11H8a3 3 0 00-3 3z"/><path d="M9 9h5M9 13h5"/></svg>
          <span>生词本</span>
          <em class="side-badge" id="wordBadge">0</em>
        </button>
      </nav>

      <div class="side-foot">
        <button class="side-mini" id="btnThemeMode">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="3.4"/></svg>
          <span id="themeLabel">深色</span>
        </button>
        <button class="side-mini" id="btnHelp">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 114 2c-.9.7-1.6 1.2-1.6 2.4"/><path d="M12 17.2h.01"/></svg>
          <span>帮助</span>
        </button>
      </div>
    </aside>

    <main class="lib-main">
      <header class="main-head">
        <div class="main-title">
          <h2 id="libTitle">我</h2>
          <p class="lib-sub" id="libSub">正在载入…</p>
        </div>
        <div class="main-acts">
          <button class="icon-btn" id="btnSideOpen" title="显示侧栏" hidden>
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </button>
          <button class="icon-btn" id="btnNotify" title="通知">
            <svg viewBox="0 0 24 24" class="ico"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg>
          </button>
          <button class="btn btn--ghost" id="btnShelfMore" title="更多">
            <svg viewBox="0 0 24 24" class="ico"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </button>
          <button class="btn btn--solid" id="btnNewBook">
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
            <span>新建</span>
          </button>
        </div>
      </header>

      <div class="lib-toolbar">
        <div class="seg" id="libSortSeg">
          <button class="seg-btn is-on" data-sort="updated">最近编辑</button>
          <button class="seg-btn" data-sort="created">创建时间</button>
          <button class="seg-btn" data-sort="name">名称</button>
        </div>
        <span class="lib-hint">长按「新建」导入文件或选模板</span>
      </div>

      <div class="lib-scroll" id="libScroll">
        <div class="lib-empty" id="libEmpty">
          <div class="empty-art">
            <svg viewBox="0 0 120 120"><rect x="18" y="14" width="84" height="94" rx="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/><path d="M32 42h56M32 58h56M32 74h34" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".28"/><path d="M36 96c10-14 18 6 26-8s14 4 22-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".7"/></svg>
          </div>
          <h3>还没有笔记</h3>
          <p>轻触「新建」创建空白笔记；长按「新建」导入文件（HTML / PDF / 图片 / Markdown 自动识别）或从模板开始。</p>
          <div class="empty-actions">
            <button class="btn btn--solid" id="btnEmptyNew">新建笔记</button>
            <button class="btn btn--ghost" id="btnEmptyImport">导入文件</button>
          </div>
        </div>
        <div class="lib-grid" id="libGrid"></div>
        <div class="lib-foot" id="libFoot"></div>
      </div>
    </main>

    <!-- 生词本抽屉 -->
    <div class="word-drawer" id="wordDrawer" hidden>
      <div class="wd-head"><b>生词本</b><button class="icon-btn icon-btn--sm" id="wdClose">✕</button></div>
      <div class="wd-list" id="wdList"></div>
      <div class="wd-foot">
        <button class="btn btn--ghost" id="wdCards">生成闪卡</button>
        <button class="btn btn--ghost" id="wdClear">清空</button>
      </div>
    </div>
  </section>

  <!-- ══════════════════ 编辑器（自由笔记式布局） ══════════════════ -->
  <section class="view view--studio fn-app" id="viewStudio">
    <header class="st-head fn-head">
      <div class="fn-capsule fn-capsule--left">
        <button class="icon-btn" id="btnBack" title="返回书架">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn" id="btnDrawerToggle" title="文档列表">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="4" width="12" height="10" rx="1.5"/><rect x="9" y="10" width="12" height="10" rx="1.5"/></svg>
        </button>
        <button class="icon-btn" id="btnUndo" title="撤销">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 10h10a5 5 0 010 10h-2"/><path d="M8 6l-4 4 4 4"/></svg>
        </button>
        <button class="icon-btn" id="btnRedo" title="重做">
          <svg viewBox="0 0 24 24" class="ico"><path d="M20 10H10a5 5 0 000 10h2"/><path d="M16 6l4 4-4 4"/></svg>
        </button>
        <button class="icon-btn fn-plus" id="btnPages" title="页面 / 新建页">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="fn-doc-meta">
        <input class="doc-title" id="docTitle" value="未命名" spellcheck="false" />
        <button class="doc-crumb" id="pageIndicator">1 / 1</button>
        <div class="save-state" id="saveState" data-state="saved" aria-live="polite"><i></i><span>已保存</span></div>
      </div>

      <div class="fn-capsule fn-capsule--right" id="toolRow">
        <button class="tool is-on" data-tool="pen" title="钢笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15.6 3.4l5 5L9 20H4v-5z" fill="#2f7cf6" stroke="none"/><path d="M13.2 5.8l5 5" stroke="#fff" stroke-width="1.5"/></svg>
          <span>钢笔</span>
        </button>
        <button class="tool" data-tool="lasso" title="框选">
          <svg viewBox="0 0 24 24" class="ico"><rect x="4" y="5" width="16" height="14" rx="2" stroke-dasharray="3 2"/></svg>
          <span>选择</span>
        </button>
        <button class="fn-tool-quick" id="btnPagePanel" title="页面列表">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 5h7l2 2h7v12H4z"/><path d="M4 5v14h16"/></svg>
        </button>
        <span class="fn-mini-sep"></span>
        <button class="tool fn-pen-tip" data-tool="pen" data-color="#1c1c1e" title="黑笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15.6 3.4l5 5L9 20H4v-5z" fill="#1c1c1e" stroke="none"/></svg>
          <span>黑笔</span>
        </button>
        <button class="tool fn-pen-tip" data-tool="pen" data-color="#2f6fc9" title="蓝笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15.6 3.4l5 5L9 20H4v-5z" fill="#2f6fc9" stroke="none"/></svg>
          <span>蓝笔</span>
        </button>
        <button class="tool fn-pen-tip" data-tool="pen" data-color="#b23a2f" title="红笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15.6 3.4l5 5L9 20H4v-5z" fill="#b23a2f" stroke="none"/></svg>
          <span>红笔</span>
        </button>
        <button class="tool fn-pen-tip" data-tool="pen" data-color="#e8a33d" title="橙笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15.6 3.4l5 5L9 20H4v-5z" fill="#e8a33d" stroke="none"/></svg>
          <span>橙笔</span>
        </button>
        <button class="tool" data-tool="marker" title="荧光笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M8.5 13.5L14 8l5 5-5.5 5.5H8.5z" fill="#f5c451" stroke="#c49a12"/><path d="M8.5 18.5H4v-3l4.5-2" stroke="#c49a12" fill="none"/></svg>
          <span>荧光</span>
        </button>
        <button class="tool" data-tool="eraser" title="橡皮">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4.5 15.5l6-6 7 7-3.5 3.5H8z" fill="#e8e8ee" stroke="#bbb"/><path d="M10.5 9.5l4-4 6 6-4 4" stroke="#bbb" fill="none"/></svg>
          <span>橡皮</span>
        </button>
        <button class="tool fn-ai" id="btnAI" title="AI / 学习功能">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="10" fill="#7c5cf6"/><path d="M12 6l1.5 4L18 12l-4.5 2L12 18l-1.5-4L6 12l4.5-2z" fill="#fff"/></svg>
          <span>AI</span>
        </button>
      </div>
    </header>

    <!-- 左侧文档抽屉：自由笔记从屏幕左侧滑出 -->
    <div class="fn-scrim" id="fnScrim"></div>
    <aside class="fn-drawer" id="fnDrawer">
      <div class="fn-drawer-head">
        <div>
          <input class="doc-title" id="fnDocTitle" value="未命名" spellcheck="false" />
          <span class="fn-drawer-sub" id="fnDrawerSub">文档列表</span>
        </div>
        <button class="icon-btn" id="fnDrawerClose" title="收起">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
      </div>
      <div class="fn-tabs">
        <button class="fn-tab is-on" data-tab="docs">资料中心</button>
        <button class="fn-tab" data-tab="books">教材中心</button>
      </div>
      <div class="fn-drawer-sec" id="fnFolderTree">
        <button class="fn-folder is-on" data-folder="all"><svg viewBox="0 0 24 24" class="ico"><path d="M3 6h7l2 2h9v10H3z"/></svg><span>所有笔记</span></button>
        <button class="fn-folder" data-folder="inbox"><svg viewBox="0 0 24 24" class="ico"><path d="M3 6h7l2 2h9v10H3z"/></svg><span>未归档笔记</span></button>
      </div>
      <div class="fn-drawer-label">当前笔记的页面</div>
      <div class="fn-pages" id="fnPages"></div>
      <details class="fn-more" open>
        <summary>功能</summary>
      <div class="fn-funcs">
        <button id="btnRead"><svg viewBox="0 0 24 24" class="ico"><path d="M4 5.5h6a2.5 2.5 0 012.5 2.5v11A2 2 0 0010.5 17H4z"/><path d="M20 5.5h-6A2.5 2.5 0 0011.5 8v11A2 2 0 0113.5 17H20z"/></svg><span>HTML 连续阅读</span></button>
        <button id="btnOutline"><svg viewBox="0 0 24 24" class="ico"><path d="M4 6h3M4 12h3M4 18h3"/><path d="M10 6h10M10 12h7M10 18h9"/></svg><span>大纲 / 脑图</span></button>
        <button id="btnExport"><svg viewBox="0 0 24 24" class="ico"><path d="M12 4v10m0 0l-3.5-3.5M12 14l3.5-3.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg><span>导出</span></button>
        <button id="btnSpeak"><svg viewBox="0 0 24 24" class="ico"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/></svg><span>朗读</span></button>
        <button id="btnRec"><svg viewBox="0 0 24 24" class="ico"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0"/><path d="M12 17.5V21"/></svg><span>录音</span></button>
        <button id="btnHtmlEye"><svg viewBox="0 0 24 24" class="ico"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></svg><span>显示 / 隐藏底稿</span></button>
        <button id="btnRuler"><svg viewBox="0 0 24 24" class="ico"><rect x="2.5" y="8.5" width="19" height="7" rx="1.5"/><path d="M6 8.5v3M9.5 8.5v3M13 8.5v3M16.5 8.5v3"/></svg><span>标尺</span></button>
        <button id="btnPick"><svg viewBox="0 0 24 24" class="ico"><path d="M15.5 3.5l5 5-2 2-1-1-6.5 6.5-3.5 1 1-3.5L15 7l-1-1z"/><path d="M5 19.5h4"/></svg><span>取色器</span></button>
        <button id="fnStickerBtn"><svg viewBox="0 0 24 24" class="ico"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="15" r="1"/><path d="M8 16c2-2 5-2 7 0"/></svg><span>贴纸</span></button>
        <button id="fnFullTextBtn"><svg viewBox="0 0 24 24" class="ico"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg><span>全屏输入</span></button>
        <button id="fnTimerBtn"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span>计时器</span></button>
        <button id="fnPenBoxBtn"><svg viewBox="0 0 24 24" class="ico"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h4M15 9h2M15 13h2"/></svg><span>自定义笔盒</span></button>
        <button id="fnMaterialBtn"><svg viewBox="0 0 24 24" class="ico"><path d="M4 5h7v14H4zM13 5h7v6h-7zM13 13h7v6h-7z"/></svg><span>素材中心</span></button>
        <button id="fnAIAssistantBtn"><svg viewBox="0 0 24 24" class="ico"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M18 16l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></svg><span>AI 助手</span></button>
        <button data-tool="text"><svg viewBox="0 0 24 24" class="ico"><path d="M5 6.5V5h14v1.5"/><path d="M12 5v14"/><path d="M9 19h6"/></svg><span>文字</span></button>
        <button data-tool="shape"><svg viewBox="0 0 24 24" class="ico"><rect x="3.5" y="8.5" width="9" height="9" rx="2"/><circle cx="16" cy="8" r="4.5"/></svg><span>形状</span></button>
        <button data-tool="tape"><svg viewBox="0 0 24 24" class="ico"><rect x="3" y="8.5" width="18" height="7" rx="1.6" fill="currentColor"/></svg><span>胶带</span></button>
        <button id="btnMore"><svg viewBox="0 0 24 24" class="ico"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg><span>更多</span></button>
      </div>
      </details>
      <div class="fn-drawer-foot">
        <button id="fnNewFolderBtn" class="fn-new-folder">＋ 新建文件夹</button>
        <button id="fnThemeBtn">设置</button>
      </div>
    </aside>
    <button class="fn-edge" id="fnEdge" title="文档列表">›</button>

    <div class="st-stage" id="stage">
      <div class="page" id="pageEl">
        <canvas class="layer" id="paperCanvas"></canvas>
        <div class="layer htmlwrap" id="htmlWrap">
          <iframe id="htmlFrame" title="笔记内容"></iframe>
        </div>
        <div class="layer" id="imgLayer"></div>
        <div class="layer" id="textLayer"></div>
        <canvas class="layer ink" id="inkBase"></canvas>
        <canvas class="layer ink" id="inkLive"></canvas>
        <canvas class="layer ink" id="laserCv"></canvas>
        <svg class="layer" id="selSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="ruler" id="ruler" hidden>
          <div class="ruler-bar"></div>
          <div class="ruler-knob ruler-knob--move" data-k="move"></div>
          <div class="ruler-knob ruler-knob--rot" data-k="rot"></div>
        </div>
        <div class="page-vignette" id="pageVignette"></div>
      </div>
      <div class="stage-hint" id="stageHint"></div>
      <button class="page-nav page-nav--l" id="btnPrevPage" aria-label="上一页"><svg viewBox="0 0 24 24" class="ico"><path d="M14.5 6l-6 6 6 6"/></svg></button>
      <button class="page-nav page-nav--r" id="btnNextPage" aria-label="下一页"><svg viewBox="0 0 24 24" class="ico"><path d="M9.5 6l6 6-6 6"/></svg></button>
    </div>

    <!-- 录音浮条 -->
    <div class="rec-bar" id="recBar" hidden>
      <span class="rec-dot" id="recDot"></span>
      <span class="rec-time" id="recTime">0:00</span>
      <div class="rec-track" id="recTrack"><i id="recFill"></i></div>
      <button class="rec-mini" id="recPlay" title="回放">▶</button>
      <button class="rec-mini" id="recStop" title="停止">■</button>
      <button class="rec-close" id="recClose" title="收起">×</button>
    </div>

    <!-- 兼容旧逻辑的隐藏工具属性容器 -->
    <footer class="dock" id="dock" hidden>
      <div class="dock-panel" id="dockPanel">
        <div class="dock-row dock-row--props" id="propRow">
          <div class="palette" id="palette"></div>
          <label class="color-custom" id="colorCustomWrap">
            <input type="color" id="colorInput" value="#1c1c1e" />
            <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15"/></svg>
          </label>
          <div class="size-block">
            <canvas id="sizePreview" width="72" height="36"></canvas>
            <input type="range" id="sizeRange" min="1" max="44" step="0.5" value="4" />
          </div>
          <div class="pen-kinds" id="penKinds">
            <button class="chip" data-kind="fountain">粗细变化</button>
            <button class="chip" data-kind="ball">均匀</button>
            <button class="chip" data-kind="pencil">铅笔</button>
          </div>
        </div>
      </div>
      <button class="dock-toggle" id="dockToggle" title="收起工具栏"></button>
    </footer>

    <div class="ctx-float" id="ctxFloat"></div>
  </section>

  <!-- 阅读模式：整篇网页连续显示，链接、锚点、折叠等原生交互全部保留，可手写批注 -->
  <div class="reader" id="reader" hidden>
    <header class="reader-bar">
      <button class="icon-btn" id="btnReaderClose" title="关闭阅读">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="reader-title" id="readerTitle">阅读</div>
      <div class="reader-tools" id="readerTools">
        <button class="rtool is-on" data-rt="pen" title="笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15.6 3.4l5 5L9 20H4v-5L15.6 3.4z"/><path d="M13.2 5.8l5 5"/></svg>
        </button>
        <button class="rtool" data-rt="marker" title="荧光笔">
          <svg viewBox="0 0 24 24" class="ico"><path d="M8.5 13.5L14 8l5 5-5.5 5.5H8.5v-5z"/><path d="M8.5 18.5H4v-3l4.5-2"/></svg>
        </button>
        <button class="rtool" data-rt="eraser" title="橡皮">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4.5 15.5l6-6 7 7-3.5 3.5H8l-3.5-3.5z"/><path d="M10.5 9.5l4-4 6 6-4 4"/></svg>
        </button>
        <button class="rtool" data-rt="undo" title="撤销">
          <svg viewBox="0 0 24 24" class="ico"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a6 6 0 010 12h-2"/></svg>
        </button>
      </div>
      <button class="reader-act" id="btnReaderTop">回到顶部</button>
    </header>
    <div class="reader-scroll" id="readerScroll">
      <div class="reader-doc" id="readerDoc">
        <iframe id="readerFrame" title="阅读视图"></iframe>
        <canvas id="readerInk"></canvas>
      </div>
    </div>
  </div>

  <!-- 遮罩与浮层 -->
  <div class="sheet-scrim" id="sheetScrim"></div>  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast"></div>

  <input type="file" id="fileHtml" accept=".html,.htm,text/html" multiple hidden />
  <input type="file" id="fileAny" accept=".html,.htm,text/html,.pdf,application/pdf,.md,.markdown,.txt,image/*" multiple hidden />
  <input type="file" id="fileImage" accept="image/*" multiple hidden />
  <input type="file" id="fileRestore" accept=".json,application/json" hidden />
</div>
