<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>墨屿 · 手写笔记</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="墨屿" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#111113" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/icon-180.png" />
<link rel="icon" type="image/png" href="./assets/icon-180.png" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ══════════════════ 资料库 ══════════════════ -->
  <section class="view view--library is-active" id="viewLibrary">
    <header class="lib-head">
      <div class="lib-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 24c4.5 0 5.5-14 10-14s5.5 14 10 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="currentColor"/></svg>
        </div>
        <div>
          <h1>墨屿</h1>
          <p class="lib-sub" id="libSub">正在载入…</p>
        </div>
      </div>
      <div class="lib-actions">
        <button class="btn btn--ghost" id="btnNewBook">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
          <span>新建笔记</span>
        </button>
        <button class="btn btn--solid" id="btnImportHtml">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 16V4m0 12l-4-4m4 4l4-4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          <span>导入 HTML</span>
        </button>
      </div>
    </header>

    <div class="lib-nav" id="libNav"></div>

    <div class="lib-toolbar">
      <div class="seg" id="libSortSeg">
        <button class="seg-btn is-on" data-sort="updated">最近编辑</button>
        <button class="seg-btn" data-sort="created">创建时间</button>
        <button class="seg-btn" data-sort="name">名称</button>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="search" id="libSearch" placeholder="搜索笔记" autocomplete="off" />
      </div>
    </div>

    <div class="lib-scroll" id="libScroll">
      <div class="lib-empty" id="libEmpty">
        <div class="empty-art">
          <svg viewBox="0 0 120 120"><rect x="18" y="14" width="84" height="94" rx="10" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/><path d="M32 42h56M32 58h56M32 74h34" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".28"/><path d="M36 96c10-14 18 6 26-8s14 4 22-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".7"/></svg>
        </div>
        <h3>还没有笔记</h3>
        <p>新建一本空白笔记，或者把 AI 生成的 .html 文件导进来，直接在上面手写批注。</p>
        <div class="empty-actions">
          <button class="btn btn--solid" id="btnEmptyNew">新建笔记</button>
          <button class="btn btn--ghost" id="btnEmptyImport">导入 HTML</button>
        </div>
      </div>
      <div class="lib-grid" id="libGrid"></div>
      <div class="lib-foot" id="libFoot"></div>
    </div>
  </section>

  <!-- ══════════════════ 编辑器 ══════════════════ -->
  <section class="view view--studio" id="viewStudio">
    <header class="st-head">
      <div class="st-head-left">
        <button class="icon-btn" id="btnBack" title="返回">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="doc-meta">
          <input class="doc-title" id="docTitle" value="未命名" spellcheck="false" />
          <button class="doc-crumb" id="pageIndicator">1 / 1</button>
          <div class="save-state" id="saveState" data-state="saved" aria-live="polite"><i></i><span>已保存</span></div>
        </div>
      </div>
      <div class="st-head-center">
        <div class="zoom-cluster">
          <button class="icon-btn icon-btn--sm" id="btnZoomOut" title="缩小">
            <svg viewBox="0 0 24 24" class="ico"><path d="M5 12h14"/></svg>
          </button>
          <button class="zoom-val" id="btnZoomReset">100%</button>
          <button class="icon-btn icon-btn--sm" id="btnZoomIn" title="放大">
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <div class="st-head-right">
        <button class="icon-btn" id="btnUndo" title="撤销">
          <svg viewBox="0 0 24 24" class="ico"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a6 6 0 010 12h-2"/></svg>
        </button>
        <button class="icon-btn" id="btnRedo" title="重做">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15 7l5 5-5 5"/><path d="M20 12h-9a6 6 0 000 12h2"/></svg>
        </button>
        <button class="icon-btn" id="btnPages" title="页面">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="4" width="8" height="10" rx="1.5"/><rect x="13" y="4" width="8" height="10" rx="1.5"/><rect x="3" y="16" width="8" height="5" rx="1.5"/><rect x="13" y="16" width="8" height="5" rx="1.5"/></svg>
        </button>
        <button class="icon-btn" id="btnRead" title="阅读模式（链接可点、全文连续）">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 5.5h6a2.5 2.5 0 012.5 2.5v11A2 2 0 0010.5 17H4z"/><path d="M20 5.5h-6A2.5 2.5 0 0011.5 8v11A2 2 0 0113.5 17H20z"/></svg>
        </button>
        <button class="icon-btn" id="btnExport" title="导出">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 4v10m0 0l-3.5-3.5M12 14l3.5-3.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        </button>
        <button class="icon-btn" id="btnMore" title="更多">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <div class="st-stage" id="stage">
      <div class="page" id="pageEl">
        <canvas class="layer" id="paperCanvas"></canvas>
        <div class="layer htmlwrap" id="htmlWrap">
          <iframe id="htmlFrame" title="笔记内容"></iframe>
        </div>
        <div class="layer" id="imgLayer"></div>
        <div class="layer" id="textLayer"></div>
        <canvas class="layer ink" id="inkBase"></canvas>
        <canvas class="layer ink" id="inkLive"></canvas>
        <svg class="layer" id="selSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="ruler" id="ruler" hidden>
          <div class="ruler-bar"></div>
          <div class="ruler-knob ruler-knob--move" data-k="move"></div>
          <div class="ruler-knob ruler-knob--rot" data-k="rot"></div>
        </div>
        <div class="page-vignette" id="pageVignette"></div>
      </div>
      <div class="stage-hint" id="stageHint"></div>
      <button class="page-nav page-nav--l" id="btnPrevPage" aria-label="上一页">
        <svg viewBox="0 0 24 24" class="ico"><path d="M14.5 6l-6 6 6 6"/></svg>
      </button>
      <button class="page-nav page-nav--r" id="btnNextPage" aria-label="下一页">
        <svg viewBox="0 0 24 24" class="ico"><path d="M9.5 6l6 6-6 6"/></svg>
      </button>
    </div>

    <!-- 底部工具坞 -->
    <footer class="dock" id="dock">
      <div class="dock-panel" id="dockPanel">
        <div class="dock-row dock-row--tools" id="toolRow">
          <button class="tool" data-tool="pen" title="钢笔">
            <svg viewBox="0 0 24 24" class="ico"><path d="M15.6 3.4l5 5L9 20H4v-5L15.6 3.4z"/><path d="M13.2 5.8l5 5"/></svg>
            <span>钢笔</span>
          </button>
          <button class="tool" data-tool="marker" title="荧光笔">
            <svg viewBox="0 0 24 24" class="ico"><path d="M8.5 13.5L14 8l5 5-5.5 5.5H8.5v-5z"/><path d="M8.5 18.5H4v-3l4.5-2"/></svg>
            <span>荧光</span>
          </button>
          <button class="tool" data-tool="eraser" title="橡皮">
            <svg viewBox="0 0 24 24" class="ico"><path d="M4.5 15.5l6-6 7 7-3.5 3.5H8l-3.5-3.5z"/><path d="M10.5 9.5l4-4 6 6-4 4"/></svg>
            <span>橡皮</span>
          </button>
          <button class="tool" data-tool="lasso" title="套索">
            <svg viewBox="0 0 24 24" class="ico"><path d="M20 9.5c0 2.8-3.6 5-8 5-1.2 0-2.4-.2-3.4-.5"/><path d="M8.6 14C5.6 13 3.8 11.4 3.8 9.5c0-2.8 3.7-5 8.2-5s8.2 2.2 8.2 5"/><path d="M8.6 14c-1.8.7-2.8 1.9-2.8 3.2 0 1.2.9 2.1 2.1 2.4"/></svg>
            <span>套索</span>
          </button>
          <button class="tool" data-tool="shape" title="形状">
            <svg viewBox="0 0 24 24" class="ico"><rect x="3.5" y="8.5" width="9" height="9" rx="2"/><circle cx="16" cy="8" r="4.5"/></svg>
            <span>形状</span>
          </button>
          <button class="tool" data-tool="text" title="文字">
            <svg viewBox="0 0 24 24" class="ico"><path d="M5 6.5V5h14v1.5"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
            <span>文字</span>
          </button>
          <button class="tool" data-tool="image" title="插入图片">
            <svg viewBox="0 0 24 24" class="ico"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
            <span>图片</span>
          </button>
          <button class="tool" data-tool="hand" title="浏览 / 阅读">
            <svg viewBox="0 0 24 24" class="ico"><path d="M8 13V6.5a1.5 1.5 0 013 0V12"/><path d="M11 12V5.5a1.5 1.5 0 013 0V12"/><path d="M14 12V7.5a1.5 1.5 0 013 0V14"/><path d="M17 11.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1.5a6 6 0 01-6-6v-2.5a1.5 1.5 0 013 0"/></svg>
            <span>浏览</span>
          </button>
          <div class="dock-sep"></div>
          <button class="tool tool--mini" id="btnHtmlEye" title="显示 / 隐藏 HTML 底稿">
            <svg viewBox="0 0 24 24" class="ico"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/></svg>
            <span>底稿</span>
          </button>
          <button class="tool tool--mini" id="btnRuler" title="标尺（沿尺面画直线）">
            <svg viewBox="0 0 24 24" class="ico"><rect x="2.5" y="8.5" width="19" height="7" rx="1.5"/><path d="M6 8.5v3M9.5 8.5v3M13 8.5v3M16.5 8.5v3"/></svg>
            <span>标尺</span>
          </button>
          <button class="tool tool--mini" id="btnPick" title="取色器（吸取网页或笔迹颜色）">
            <svg viewBox="0 0 24 24" class="ico"><path d="M15.5 3.5l5 5-2 2-1-1-6.5 6.5-3.5 1 1-3.5L15 7l-1-1z"/><path d="M5 19.5h4"/></svg>
            <span>取色</span>
          </button>
        </div>

        <div class="dock-row dock-row--props" id="propRow">
          <div class="palette" id="palette"></div>
          <label class="color-custom" id="colorCustomWrap">
            <input type="color" id="colorInput" value="#1c1c1e" />
            <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15"/></svg>
          </label>
          <div class="prop-sep"></div>
          <div class="size-block">
            <canvas id="sizePreview" width="72" height="36"></canvas>
            <input type="range" id="sizeRange" min="1" max="44" step="0.5" value="4" />
          </div>
          <div class="prop-sep"></div>
          <div class="pen-kinds" id="penKinds">
            <button class="chip" data-kind="fountain">粗细变化</button>
            <button class="chip" data-kind="ball">均匀</button>
            <button class="chip" data-kind="pencil">铅笔</button>
          </div>
        </div>
      </div>
      <button class="dock-toggle" id="dockToggle" title="收起工具栏">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </footer>

    <!-- 悬浮快捷条（套索选中时出现） -->
    <div class="ctx-float" id="ctxFloat"></div>
  </section>

  <!-- 阅读模式：整篇网页连续显示，链接、锚点、折叠等原生交互全部保留 -->
  <div class="reader" id="reader" hidden>
    <header class="reader-bar">
      <button class="icon-btn" id="btnReaderClose" title="关闭阅读">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="reader-title" id="readerTitle">阅读</div>
      <button class="reader-act" id="btnReaderTop">回到顶部</button>
    </header>
    <div class="reader-scroll" id="readerScroll">
      <div class="reader-doc" id="readerDoc">
        <iframe id="readerFrame" title="阅读视图"></iframe>
      </div>
    </div>
  </div>

  <!-- 遮罩与浮层 -->
  <div class="sheet-scrim" id="sheetScrim"></div>  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast"></div>

  <input type="file" id="fileHtml" accept=".html,.htm,text/html" multiple hidden />
  <input type="file" id="fileImage" accept="image/*" multiple hidden />
  <input type="file" id="fileRestore" accept=".json,application/json" hidden />
</div>

<script src="./js/util.js"></script>
<script src="./js/idb.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/ink.js"></script>
<script src="./js/htmlpage.js"></script>
<script src="./js/pdf.js"></script>
<script src="./js/library.js"></script>
<script src="./js/studio.js"></script>
<script src="./js/boot.js"></script>
</body>
</html>
